name: Sync forks

on:
  schedule:
    - cron: '17 20 * * *' # 每天北京时间 04:17
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-forks
  cancel-in-progress: false

jobs:
  preflight:
    name: Check forks before scheduling
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repos: ${{ steps.check.outputs.repos }}
      has_work: ${{ steps.check.outputs.has_work }}
    steps:
      - name: Check out workflow scripts
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check access and synchronization compatibility
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          EXPECTED_REPOS: ${{ vars.FORK_REPOS }}
          GIT_TERMINAL_PROMPT: '0'
          RESULT_FILE: ${{ runner.temp }}/fork-sync-preflight.json
        run: python3 scripts/fork_preflight.py

      - name: Upload preflight results
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/fork-sync-preflight.json
          archive: false
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  sync:
    needs: preflight
    if: ${{ needs.preflight.outputs.has_work == 'true' }}
    name: Sync ${{ matrix.repo }}
    permissions:
      contents: read
    runs-on: ubuntu-slim

    defaults:
      run:
        shell: bash

    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      TARGET_REPO: ${{ matrix.repo }}
      GIT_TERMINAL_PROMPT: '0'

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repo: ${{ fromJSON(needs.preflight.outputs.repos) }}

    steps:
      - name: Check out workflow scripts
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Synchronize compatible branches and tags
        id: synchronize
        env:
          RESULT_FILE: ${{ runner.temp }}/fork-sync-result-${{ strategy.job-index }}.json
        run: python3 scripts/sync_fork.py

      - name: Upload temporary result file
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          # 仅上传单个小 JSON; archive=false 时文件名即 artifact 名称.
          path: ${{ runner.temp }}/fork-sync-result-${{ strategy.job-index }}.json
          archive: false
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  summary:
    name: Summarize all forks
    needs: [preflight, sync]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out workflow scripts
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download temporary result files
        id: download
        uses: actions/download-artifact@v8
        with:
          pattern: fork-sync-*.json
          path: ${{ runner.temp }}/fork-sync-results
          merge-multiple: true

      - name: Write consolidated summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          RESULTS_DIR: ${{ runner.temp }}/fork-sync-results
          EXPECTED_REPOS: ${{ vars.FORK_REPOS }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: python3 scripts/sync_summary.py
